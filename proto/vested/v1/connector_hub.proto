syntax = "proto3";

package vested.v1;

option go_package = "github.com/vestedsystems/vested-ai-core/runtime/gen/vested/v1;vestedv1";
option php_namespace            = "Vested\\Connect\\Sdk\\Generated\\Proto\\Vested\\V1";
option php_metadata_namespace   = "Vested\\Connect\\Sdk\\Generated\\Proto\\GPBMetadata";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

service ConnectorHub {
  rpc Connect(stream ConnectorMsg) returns (stream HubMsg);
}

message ConnectorMsg {
  oneof body {
    Hello hello = 1;
    Register register = 2;
    ToolCallResponse tool_call_response = 3;
    Heartbeat heartbeat = 4;
    CredentialOpResponse credential_op_response = 5;
  }
}

message Hello {
  string sdk_language = 1;
  string sdk_version = 2;
  string worker_id = 3;
}

message Register {
  string baseline_fingerprint = 1;
  repeated AgentDecl agents = 2;
  // Absent = this connector uses no per-user auth; the platform then hides it
  // from the user-facing credential UI entirely and never gates its tools.
  CredentialSchemaDecl credential_schema = 3;
  // Absent = this connector fronts no relational database. It is then invisible
  // to schema extraction and, in a later slice, ungoverned by the SQL gate —
  // the same "declare nothing, stay untouched" contract as credential_schema.
  RelationalSourceDecl relational_source = 4;
}

// Declares that this connector fronts a relational database whose schema the
// platform may extract and, later, authorize queries against.
message RelationalSourceDecl {
  string engine        = 1;  // "sqlserver" | "mysql"
  string describe_tool = 2;  // rowset tool that returns the canonical schema
  string query_tool    = 3;  // the free-form SQL tool the gate governs
  // Which argument of query_tool carries the SQL. Per-connector and never
  // assumed: erp_bc is the .NET SDK and serialises PascalCase, so its key is
  // "Sql". Reading the wrong key returns null and silently gates nothing.
  string sql_arg       = 4;
  // Cheap hash of the source catalog. The core re-extracts only when this
  // changes, so a connector that knows its own DB is unchanged costs nothing.
  string fingerprint   = 5;
  // The databases (MySQL) or companies (Business Central) this source spans.
  // Declared because the SDK must validate at BOOTSTRAP, before any
  // extraction has happened — see default_scope.
  repeated string scopes = 6;
  // Which scope an UNQUALIFIED table name resolves in. The connector owns the
  // DSN, so it is the only party that knows. A source declaring more than one
  // scope MUST set this; the SDK throws at startup otherwise.
  //
  // ⚠ This decides what an unqualified name means and NOTHING else. A
  // qualified `scope.table` is never re-pointed at the default, and a
  // cross-scope join resolves each side in its own scope.
  string default_scope = 7;
}

// Declares that this connector's tools act on behalf of the calling user and
// need credentials that only the worker can read. The core renders a form from
// this declaration and seals what the user types to the connector's public key.
message CredentialSchemaDecl {
  string kind = 1;      // "basic" | "token" | "custom"
  string title = 2;     // shown as the form heading, e.g. "Al-Saif ERP account"
  string help_text = 3;
  repeated CredentialFieldDecl fields = 4;
}

message CredentialFieldDecl {
  string key = 1;                // map key in the sealed field map, e.g. "username"
  string label = 2;
  string type = 3;               // "text" | "password" | "url" | "select"
  bool required = 4;
  string placeholder = 5;
  repeated string options = 6;   // "select" only
}

message AgentDecl {
  string key = 1;
  string name = 2;
  string description = 3;
  string status = 4; // "active" | "inactive"
  ModelDecl model = 5;
  repeated InstructionDecl instructions = 6;
  repeated ToolDecl tools = 7;
}

message ModelDecl {
  string provider = 1;
  string name = 2;
  google.protobuf.Struct config = 3;
}

message InstructionDecl {
  string type = 1;
  string format = 2;
  string body = 3;
  uint32 position = 4;
}

enum ResultKind {
  RESULT_KIND_SINGLE = 0; // one atomic result (today's behavior)
  RESULT_KIND_ROWSET = 1; // paginated row set (sample-in-context, full by-reference)
}

message ToolDecl {
  string key = 1;
  string name = 2;
  string description = 3;
  bytes input_schema_json = 4; // raw JSON Schema; bytes avoids UTF-8 validation
  bytes output_schema_json = 5; // raw JSON Schema; bytes avoids UTF-8 validation
  uint32 default_deadline_ms = 6;
  uint32 max_result_bytes = 7;
  // Connector-declared tool sensitivity. One of:
  // "read" | "write" | "destructive" | "external_call" | "medium".
  // Empty = unset; the hub defaults it to "external_call". Admins can
  // override the effective value later in the admin UI.
  string sensitivity = 8;
  ResultKind result_kind = 9; // SINGLE unless the tool is a PaginatedToolHandler
}

message ToolCallResponse {
  string invocation_id = 1;
  oneof result {
    bytes result_json = 2; // JSON-encoded; validated against tool output_schema on receive
    string error = 3;
  }
  uint32 duration_ms = 4;
  string next_cursor = 5; // empty = last page (ROWSET only)
  uint64 total_rows = 6;  // 0 = unknown (ROWSET only)
}

message Heartbeat { google.protobuf.Timestamp at = 1; }

message HubMsg {
  oneof body {
    HelloAck hello_ack = 1;
    RegisterAck register_ack = 2;
    ToolCallRequest tool_call_request = 3;
    HeartbeatAck heartbeat_ack = 4;
    GoAway go_away = 5;
    CredentialOpRequest credential_op_request = 6;
  }
}

// Asks the connector to do something with a user's sealed credential that only
// it can do: try it against the real system, or tear down a remote session.
// The core cannot open the envelope, so every credential-lifecycle question is
// answered here or not at all.
message CredentialOpRequest {
  string op_id = 1;
  string op = 2;            // "validate" | "revoke"
  string user_id = 3;
  string user_email = 4;
  string employee_no = 5;
  string erp_identifier = 6;
  bytes  envelope_json = 7; // the sealed envelope, verbatim
  uint32 deadline_ms = 8;
}

message CredentialOpResponse {
  string op_id = 1;
  bool   ok = 2;
  // User-facing. The connector must not put the credential in here.
  string error = 3;
  // Non-secret facts to show the user, e.g. {"account": "j.smith@erp"}.
  google.protobuf.Struct display = 4;
}

message HelloAck {
  string connector_id = 1;
  string organization_id = 2;
  string namespace = 3;
  uint32 max_agents = 4;
  uint32 max_tools_per_agent = 5;
  uint32 max_concurrent_tool_calls = 6;
}

message RegisterAck {
  string baseline_fingerprint = 1;
  string status = 2; // "accepted" | "rejected"
  repeated DeclIssue issues = 3;
}

message DeclIssue {
  string path = 1;
  string code = 2;
  string message = 3;
}

message ToolCallRequest {
  string invocation_id = 1;
  string agent_key = 2;
  string tool_key = 3;
  bytes args_json = 4; // JSON-encoded; validated against tool input_schema before send
  string organization_id = 5;
  string user_id = 6;
  string conversation_id = 7;
  uint32 deadline_ms = 8;
  string user_email = 9;
  // Optional ERP/HR identity of the calling user, so a connector (e.g. an
  // ERP integration) can resolve who the tool call is on behalf of.
  // Empty when unset. employee_no + erp_identifier come from the user.
  // erp_department_identifiers holds the ERP identifier of EACH department
  // the user belongs to in the run's org (a user can be in several);
  // empty list when the user has no department or none carry an ERP id.
  string employee_no = 10;
  string erp_identifier = 11;
  repeated string erp_department_identifiers = 12;
  string cursor = 13;    // opaque page cursor; empty = first page (ROWSET only)
  uint32 page_size = 14; // requested rows/page; 0 = connector default (ROWSET only)
  // The calling user's sealed credential, forwarded verbatim. Present only for
  // connectors that declared a credential_schema; empty for every other
  // connector, which is what keeps existing integrations ungated. The hub
  // cannot open it — only the worker's private key can.
  bytes credential_envelope_json = 15;
  // Absent unless this is the connector's governed query_tool AND the gate
  // reached a decision. See SchemaContext — absent is not empty.
  SchemaContext schema_context = 16;
}

// What the core's SQL gate resolved for this call, so a connector can apply
// its OWN permission layer on top of the core's decision.
//
// ⚠ ABSENT IS NOT EMPTY. No schema_context means the core has nothing to tell
// you — this connector declares no relational_source, or its gate mode is
// `off`, or this is not the governed query_tool. It NEVER means "no tables
// were touched". A permission check that treats absent as empty approves
// everything, silently, which is the one failure mode this message must not
// invite. An empty `tables` inside a PRESENT context is a different claim.
//
// Advisory and one-way: the core has already decided. Refuse from your handler
// if your own rules say so; nothing you do here returns to the core.
message SchemaContext {
  repeated SchemaContextTable tables = 1;

  // The statement selects `*` somewhere. Carried because a connector's own
  // rule may be stricter than the core's about unbounded reads.
  bool has_star = 2;

  // "enforce" | "observe". Present so a connector can tell "the core refused
  // this and is letting it through anyway" (observe) from "the core allowed
  // it" (enforce) — the core not enforcing does not mean you should not.
  string gate_mode = 3;
}

message SchemaContextTable {
  // The platform's label for the entity. NOT a queryable object name — on
  // Business Central the real object carries a company prefix and an
  // extension suffix. Key permission checks on `physical`.
  string logical_name = 1;

  string scope = 2;

  // "table" | "view".
  string kind = 3;

  // The physical name(s) this statement actually referenced, canonical as
  // stored in the snapshot — not as the model spelled them, which resolution
  // matches case-insensitively.
  repeated string physical = 4;

  // Column-level context is deliberately absent: the extractor's columns are
  // unqualified and unattributed, so they cannot say WHICH table a column
  // belongs to. Reserved as field 5 when attribution exists.
}

message HeartbeatAck { google.protobuf.Timestamp at = 1; }
message GoAway { string reason = 1; }
